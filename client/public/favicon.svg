<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Dark background circle -->
  <rect width="64" height="64" rx="14" fill="#0f1115"/>
  
  <!-- Envelope body -->
  <rect x="10" y="20" width="44" height="30" rx="4" fill="#171a21" stroke="#ff7a1a" stroke-width="1.5"/>
  
  <!-- Envelope flap / V shape -->
  <polyline points="10,20 32,38 54,20" stroke="#ff7a1a" stroke-width="1.5" stroke-linejoin="round" fill="none"/>
  
  <!-- Snowflake / cold accent — top right badge -->
  <circle cx="46" cy="14" r="8" fill="#0f1115"/>
  <text x="46" y="18" text-anchor="middle" font-size="11" fill="#ff7a1a" font-family="Arial, sans-serif" font-weight="bold">❄</text>
</svg>